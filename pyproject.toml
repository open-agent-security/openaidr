[project]
name = "openaidr"
version = "0.0.1"
description = "Session collection for AI coding agents — reads what agents write to disk and normalises it into one session model."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Prasanth G", email = "prasanth@openaca.dev" }]
keywords = ["ai-security", "agent-security", "observability", "session", "telemetry", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "adr-sensor>=1.0.0",
]

[project.scripts]
openaidr = "openaidr.__main__:main"

[project.urls]
Homepage = "https://github.com/open-agent-security/openaidr"
Repository = "https://github.com/open-agent-security/openaidr"
Issues = "https://github.com/open-agent-security/openaidr/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openaidr"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
