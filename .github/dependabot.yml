version: 2
updates:
  # `adr-sensor` is pinned exactly (==1.0.0), and the adapter reads upstream
  # internals as well as its public entry point — a test asserts the exact
  # error string upstream prints. A PR here is the deliberate re-check that
  # pin is meant to force; it is not expected to merge unreviewed.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
