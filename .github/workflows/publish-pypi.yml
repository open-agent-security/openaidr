name: Publish PyPI

# Publishes the `openaidr` distribution to PyPI from version Git tags.
#
# One-time PyPI setup (done once, by a human, before the first tag):
# 1. On https://pypi.org/manage/account/publishing/, add a *pending*
#    Trusted Publisher (pending, because the project does not exist on
#    PyPI until the first successful upload):
#      - PyPI Project Name: openaidr
#      - Owner: open-agent-security
#      - Repository name: openaidr
#      - Workflow name: publish-pypi.yml
#      - Environment name: pypi
# 2. Create the `pypi` environment on this repo (the name must match the
#    publisher config exactly, or the OIDC exchange is rejected).
# 3. Publish by pushing a tag whose name matches pyproject.toml's version,
#    e.g. `git tag v0.0.1 && git push origin v0.0.1`.
#
# No PyPI token is needed, and none should be added. `pypa/gh-action-pypi-publish`
# exchanges the GitHub OIDC token for a short-lived, scope-limited PyPI publish
# token — nothing long-lived sits in repo secrets waiting to leak.
#
# Workflow-injection safety: no step consumes user/PR-controlled input.
# GITHUB_REF_NAME is GitHub-injected (the tag name) and can only contain
# git-ref-safe characters.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tagged commit $(git rev-parse --short HEAD) is not reachable from origin/main. Release tags must be cut from main."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Match pyproject.toml `requires-python` and ci.yml.
          python-version: "3.11"

      - name: Sync deps
        run: uv sync --frozen

      - name: Verify tag matches package version
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $package_version"
            exit 1
          fi

      - name: Verify __version__ matches package version
        # `openaidr --version` output comes from src/openaidr/__init__.py, not
        # pyproject.toml. If the two drift, PyPI ships a wheel whose CLI
        # reports a version that doesn't exist — and PyPI versions are
        # immutable, so the only fix is burning another version number.
        run: |
          dunder_version="$(uv run python -c 'import openaidr; print(openaidr.__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$dunder_version" != "$tag_version" ]; then
            echo "::error::openaidr.__version__ is $dunder_version but the tag is $GITHUB_REF_NAME. Bump both together."
            exit 1
          fi

      - name: Verify release notes file exists
        # Fail BEFORE PyPI publish if no notes file is committed. PyPI
        # publishes are immutable — a missing notes file caught after
        # publish would mean shipping to PyPI while leaving the GitHub
        # Releases page silently inconsistent. The release-openaidr
        # skill writes this file during the release prep PR.
        run: |
          notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes_path" ]; then
            echo "::error::missing release notes file at $notes_path. The release-openaidr skill drafts this file from the commit log; run it before tagging."
            exit 1
          fi

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q

      - name: Build package
        run: uv build

      - name: Check package metadata
        # twine >=7 required: hatchling emits `Metadata-Version: 2.5` (PEP 794),
        # and twine 6.2.0 and earlier hard-cap recognized metadata versions at
        # 2.4, so they reject a perfectly valid wheel. Unpinned `uvx twine` can
        # resolve an older cached twine from the uv cache this workflow warms.
        run: uvx --from 'twine>=7' twine check dist/*

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openaidr/
    permissions:
      contents: read
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release-github:
    # Create the GitHub Release object so the Releases page reflects what
    # actually shipped. Runs only after PyPI publish succeeds — if PyPI
    # failed there's no reason to advertise the release on GitHub. The
    # notes file's presence was verified in the build job, so the only
    # failure modes here are gh/API errors.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create writes the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes_path="docs/releases/${TAG}.md"
          # The first H1 line in the notes file becomes the Release title.
          title="$(grep -m1 '^# ' "$notes_path" | sed 's/^# //' || true)"
          if [ -z "$title" ]; then
            title="$TAG"
          fi
          # Mark PEP 440 pre-releases (aN/bN/rcN suffix) as GitHub prereleases.
          # `gh release create` defaults to "latest stable" otherwise.
          prerelease_flag=""
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$title" \
            --notes-file "$notes_path" \
            --verify-tag \
            $prerelease_flag
