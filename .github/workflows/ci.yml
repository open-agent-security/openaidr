name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The rule this enforces ("OpenAIDR installs and runs correctly for
      # someone who has never heard of any consumer of it") applies to docs
      # and config just as much as to Python sources, so it runs before the
      # Python gates and does not depend on a synced environment.
      - name: No proprietary references
        run: bash scripts/check-no-proprietary.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Match pyproject.toml `requires-python`. Pinning here in CI catches
          # any newer-syntax regressions that would break the lower bound.
          # `python-version` here both installs that interpreter AND sets
          # UV_PYTHON so every subsequent `uv sync`/`uv run` uses it.
          python-version: "3.11"

      - name: Sync deps
        # `--frozen` forbids re-resolution: CI installs exactly what's in the
        # committed uv.lock instead of silently picking up newer transitive
        # versions. If uv.lock is missing or stale vs. pyproject.toml, this
        # fails fast — exactly what we want in CI.
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests (pytest)
        run: uv run pytest -q
